site_name: ci-eoap-container
site_description: A CI runtime for managing CWL documents as OCI artifacts.
repo_url: https://github.com/Terradue/ci-eoap-container
site_url: https://terradue.github.io/ci-eoap-container/
edit_uri: edit/develop/docs/
theme:
  name: readthedocs
  navigation_depth: 3
plugins:
  - search
strict: true
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
nav:
  - Home: index.md
  - Tutorials:
      - Your first CWL validation: tutorials/first-workflow.md
  - How-to guides:
      - Build and run the container: how-to/build-and-run.md
      - Validate and transform CWL: how-to/transform-cwl.md
      - Publish a CWL artifact: how-to/publish-artifacts.md
      - Scan and push container images: how-to/scan-and-push.md
      - Image security monitoring: how-to/image-security.md
      - Retrieve notices and review licenses: how-to/license-review.md
      - Maintain the documentation: how-to/documentation.md
  - Reference:
      - Included tools: reference/tools.md
      - CI pipeline and artifacts: reference/ci.md
  - Explanation:
      - CWL and OCI in the CI runtime: explanation/cwl-and-oci.md
      - License reports and notices: explanation/license-evidence.md
