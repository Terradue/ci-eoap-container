name: build

on:
  push:
    branches: [develop, main]
    tags:
      - 'v*'

jobs:
  # ------------------------------------------------------------
  # Resolve release tag from ref
  # ------------------------------------------------------------
  release-meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == "refs/heads/develop" ]]; then
            TAG="latest-dev"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            TAG="latest"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"

            # --------------------------------------------------
            # Validate against release.yaml
            # --------------------------------------------------
            RELEASE_VERSION=$(yq -r '.image_version' release.yaml)

            if [[ -z "${RELEASE_VERSION}" || "${RELEASE_VERSION}" == "null" ]]; then
              echo "image_version not found in release.yaml"
              exit 1
            fi

            if [[ "${TAG}" != "${RELEASE_VERSION}" ]]; then
              echo "Git tag v${TAG} does not match release.yaml version ${RELEASE_VERSION}"
              exit 1
            fi
          else
            echo "Unsupported ref ${GITHUB_REF}"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------
  # Build, SBOM, push
  # ------------------------------------------------------------
  build-scan-push:
    needs: release-meta
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y jq skopeo
          curl -sL https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_linux_amd64.tar.gz | tar -xz oras
          sudo mv oras /usr/local/bin/oras

      - name: Configure Docker Hub auth for Kaniko
        run: |
          if [[ -n "${{ secrets.dockerhub-username }}" ]]; then
            mkdir -p "$HOME/.docker"
            cat > "$HOME/.docker/config.json" <<EOF
          {
              "auths": {
                "https://index.docker.io/v1/": {
                  "auth": "$(echo -n "${{ secrets.dockerhub-username }}:${{ secrets.dockerhub-token }}" | base64 -w0)"
                }
              }
          }
          EOF
          fi

      - name: Build image with Kaniko (to tar)
        uses: docker://gcr.io/kaniko-project/executor:debug
        env:
          DOCKER_CONFIG: /github/home/.docker
        with:
          args: >
            --context .
            --dockerfile Dockerfile
            --no-push
            --cache=false
            --tar-path image.tar

      - name: Generate SBOM (CycloneDX JSON)
        uses: docker://aquasec/trivy:0.50.2
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        with:
          args: >
            image
            --input image.tar
            --format cyclonedx
            --output sbom.cdx.json

      - name: Preserve full SBOM
        uses: actions/upload-artifact@v4
        with:
          name: image-sbom
          path: sbom.cdx.json
          retention-days: 30
          if-no-files-found: error

      # Report license classifications for review; findings do not block release.
      # Scanner/runtime errors still fail the job.
      - name: Scan image licenses (report only)
        id: license-scan
        uses: docker://aquasec/trivy:0.50.2
        with:
          args: >
            image
            --input image.tar
            --scanners license
            --license-full
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
            --format json
            --output license-report.json
            --exit-code 0
            --timeout 15m
            --no-progress

      - name: Format license review report
        uses: docker://aquasec/trivy:0.50.2
        with:
          args: >
            convert
            --format table
            --output license-report.txt
            license-report.json

      - name: Publish license review summary
        run: |
          set -euo pipefail
          {
            echo '## License review (report only)'
            echo 'Download the license-review artifact for the full JSON and text reports.'
            echo 'Findings do not block publication. Classifications are review signals, not legal conclusions.'
            echo
            echo '| Trivy severity | Detected license entries |'
            echo '| --- | ---: |'
            jq -r '[.Results[]? | .Licenses[]?] | group_by(.Severity)[] | "| \(.[0].Severity) | \(length) |"' license-report.json
            echo
            echo 'An empty report does not establish complete coverage or legal compliance.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload license review reports
        if: ${{ always() && steps.license-scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: license-review
          path: |
            license-report.json
            license-report.txt
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------------
      # Push image and attach license notices
      # --------------------------------------------------------
      - name: Push image with Skopeo
        id: push
        run: |
          set -euo pipefail

          TAG=${{ needs.release-meta.outputs.tag }}
          REGISTRY=$(yq -r '.image_registry' release.yaml)
          IMAGE_PREFIX=$(yq -r '.image_prefix' release.yaml)
          IMAGE=$(yq -r '.image_name' release.yaml)

          IMAGE_REF="${REGISTRY}/${IMAGE_PREFIX}/${IMAGE}:${TAG}"

          skopeo copy \
            --digestfile pushed.digest \
            --dest-creds="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            docker-archive:image.tar \
            "docker://${IMAGE_REF}"

          DIGEST=$(cat pushed.digest)

          echo "${REGISTRY}/${IMAGE_PREFIX}/${IMAGE}@${DIGEST}" > image.digest
          echo "image=$(cat image.digest)" >> "$GITHUB_OUTPUT"

      - name: Attach CycloneDX SBOM to published digest
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE_REF=$(cat image.digest)
          printf '%s' "$REGISTRY_TOKEN" | oras login "${IMAGE_REF%%/*}" --username "$REGISTRY_USER" --password-stdin
          oras attach --artifact-type application/vnd.cyclonedx+json \
            "$IMAGE_REF" sbom.cdx.json:application/vnd.cyclonedx+json

      - name: Generate NOTICE and attach license notices
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE_REF=$(cat image.digest)
          REGISTRY="${IMAGE_REF%%/*}"
          test -s LICENSE

          printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" \
            --username "$REGISTRY_USER" --password-stdin
          docker pull "$IMAGE_REF"
          bash scripts/generate-notice.sh "$IMAGE_REF" NOTICE
          test -s NOTICE

          printf '%s' "$REGISTRY_TOKEN" | oras login "$REGISTRY" \
            --username "$REGISTRY_USER" --password-stdin
          oras attach \
            --artifact-type application/vnd.eoap.license-notices.v1 \
            --annotation "org.opencontainers.image.title=License and third-party notices" \
            "$IMAGE_REF" LICENSE:text/plain NOTICE:text/plain

  monitor:
    needs: build-scan-push
    if: ${{ always() && needs.build-scan-push.outputs.image != '' }}
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/scan-image.yaml
    with:
      image: ${{ needs.build-scan-push.outputs.image }}

  dependency-graph:
    needs: build-scan-push
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: oras-project/setup-oras@v1
        with:
          version: 1.3.0
      - name: Retrieve published SBOM and submit inventory
        env:
          IMAGE: ${{ needs.build-scan-push.outputs.image }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          python3 scripts/image_sbom.py retrieve "$IMAGE" sbom.cdx.json
          python3 scripts/image_sbom.py snapshot sbom.cdx.json snapshot.json
          gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" --input snapshot.json
